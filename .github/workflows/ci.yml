name: CI

on:
  push:
    branches: [main]
    # Match ALL tags, not just well-formed ones. Filtering to "*@*" here would
    # mean a malformed tag never triggers CI at all, so the tag-format job could
    # never reject it — the gate must see bad input in order to fail on it.
    tags: ["**"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test + typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags needed by the hygiene gate

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - run: bun install --frozen-lockfile

      - name: typecheck
        run: bun run typecheck

      - name: test
        run: bun test

  hygiene:
    name: version + tagging hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - run: bun install --frozen-lockfile

      # On a tag build, versions must already be tagged — strict mode.
      - name: hygiene (tagged build)
        if: startsWith(github.ref, 'refs/tags/')
        run: bun scripts/check-versions.ts --tags

      - name: hygiene
        if: "!startsWith(github.ref, 'refs/tags/')"
        run: bun scripts/check-versions.ts

  tag-format:
    name: tag format
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: reject bare version tags
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          echo "tag: $TAG"
          if [[ "$TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "::error::Bare version tag '$TAG'. Packages version independently — use <package>@<version>."
            exit 1
          fi
          BASE="${TAG%@*}"
          KNOWN=0
          for d in packages/*/package.json; do
            NAME=$(node -e "process.stdout.write(require('./$d').name||'')")
            [ "$BASE" = "${NAME##*/}" ] && KNOWN=1
          done
          if [ "$KNOWN" -ne 1 ]; then
            echo "::error::Tag '$TAG' has no matching package in packages/."
            exit 1
          fi
          if [[ ! "$TAG" =~ @[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag '$TAG' does not end in a semver version."
            exit 1
          fi
          echo "tag format ok"
